appId: com.vblast.flipaclip
---
- launchApp: com.vblast.flipaclip
- extendedWaitUntil:
    visible: "Movies"
    timeout: 10000
- swipe:
    direction: LEFT
    duration: 300
- extendedWaitUntil:
    visible: "Movie Layout 1"
    timeout: 5000
- longPressOn: "Movie Layout 1"
- tapOn: "Movie Layout 2"
- tapOn: "Movie Layout 3"
- tapOn: "Delete"
- tapOn: "DELETE"
- assertVisible: "IT'S SO DESOLATE IN HERE…"
