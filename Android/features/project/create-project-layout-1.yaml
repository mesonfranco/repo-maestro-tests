appId: com.vblast.flipaclip
env:
    PROJECT_NAME: "My Project Layout 1"
---
- tapOn:
    id: "navCreateProjectBackground"
- tapOn: "Name your animation"
- inputText: ${PROJECT_NAME}
- tapOn: Back
- tapOn: "CREATE PROJECT"
- assertVisible: "Brush"
- assertVisible: "Ruler"
- assertVisible: "Copy"
- assertVisible: "Paste"
- assertVisible: "Undo"
- assertVisible: "Redo"
- assertVisible: "Scale To Fit"
- assertVisible: "Make Movie"
- assertVisible: "More"
- assertVisible: "Audio"
- assertVisible: "First Frame"
- assertVisible: "Play"
- assertVisible: "Last Frame"
- assertVisible: "Layers"
- assertVisible:
    id: "image"
