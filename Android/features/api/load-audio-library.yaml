appId: com.vblast.flipaclip
tags:
  - api
---
- tapOn: "Studio"
- tapOn:
    id: "icon"
- tapOn: "Audio track"
- tapOn:
    id: "icon"
    index: 1
- tapOn: "Audio Library"
- extendedWaitUntil:
    visible: "Fight - Sound FX"
    timeout: 10000
- assertVisible:
    id: "artworkImage"
- tapOn:
    id: "staticArrowIcon"
- extendedWaitUntil:
    visible: "Fight - Sound FX"
    timeout: 10000
- assertVisible:
    id: "artworkImage"
- tapOn: "Back"
- tapOn: "Close"