appId: com.example.app
---
- runFlow: "../project/create-generic-project.yaml"
- extendedWaitUntil:
    visible: "Studio"
    timeout: 10000
- tapOn: "Studio"
- tapOn:
    id: "icon"
- tapOn: "Audio track"
- tapOn:
    id: "icon"
    index: 1
- tapOn: "Audio Library"
- extendedWaitUntil:
    visible: "Fight - Sound FX"
    timeout: 10000
- tapOn:
    id: "staticArrowIcon"
- extendedWaitUntil:
    visible: "Fight - Sound FX"
    timeout: 10000
- assertVisible:
    id: "artworkImage"
- tapOn: "Back"
- tapOn: "Close"